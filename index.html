<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hatıra Fotoğraf Kabini – T3 Adana</title>
<style>
:root{--g:#0b6b3a;--g2:#1f9d55;--r:#c8202a;--bg:#f2f7f3;--tx:#1d2a22}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;background:#fff;display:flex;justify-content:center;align-items:center;gap:24px;padding:10px;border-bottom:4px solid var(--g2)}
header img{height:54px}
h1{font-size:1.4rem;margin:14px 12px 4px;text-align:center;color:var(--g)}
p.sub{margin:0 12px 10px;text-align:center;opacity:.8}
#stage{position:relative;height:min(68vh,640px);aspect-ratio:9/16;background:#000;border-radius:18px;overflow:hidden;box-shadow:0 8px 28px #0003}
#stage video,#stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#video.mirror{transform:scaleX(-1)}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:9rem;font-weight:800;color:#fff;text-shadow:0 4px 20px #000a}
#busy{position:absolute;inset:0;background:#000b;color:#fff;display:none;align-items:center;justify-content:center;font-size:1.3rem;text-align:center;padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 10px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 22px;background:var(--g);color:#fff;cursor:pointer;font-size:1.05rem}
button.alt{background:#fff;color:var(--g);border:2px solid var(--g)}
button.chip{padding:12px 16px;font-size:.95rem}
button.chip.on{background:var(--g);color:#fff}
button.red{background:var(--r)}
button:disabled{opacity:.5}
.theme{width:56px;height:56px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #0004;padding:0}
.theme.on{box-shadow:0 0 0 4px var(--r)}
#mailbox{display:none;width:min(92vw,520px);margin-bottom:24px}
#mailbox input[type=email]{width:100%;font:inherit;padding:14px;border-radius:12px;border:2px solid #9bb8a5;margin-bottom:8px}
label.k{display:flex;gap:8px;font-size:.85rem;margin-bottom:10px;align-items:flex-start}
#msg{text-align:center;font-weight:600;min-height:1.4em}
.hide{display:none!important}
#stage{margin-top:6px}
</style>
</head>
<body>
<header><img src="logo-festival.png" alt="Festival"><img src="logo-ttt.png" alt="Türkiye Teknoloji Takımı"></header>
<h1>Hatıra Fotoğrafını Çekelim!</h1>
<p class="sub">Fotoğrafını çek, arkaplanını değiştirelim, e-postana gönderelim.</p>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="result" class="hide"></canvas>
  <div id="count"></div>
  <div id="busy">Fotoğraf hazırlanıyor…</div>
</div>

<div class="row" id="rowShoot"><button id="btnShoot">📸 Fotoğraf Çek</button><button class="alt" id="btnFlip">🔄 Kamerayı Çevir</button></div>

<div id="rowResult" class="hide">
  <div class="row" id="themes"></div>
  <div class="row">
    <button class="alt" id="btnRetake">↺ Yeniden Çek</button>
    <button class="alt" id="btnDownload">⬇ Kaydet</button>
    <button id="btnMail">✉ E-posta ile Gönder</button>
  </div>
</div>

<div id="mailbox">
  <input type="email" id="email" placeholder="E-posta adresin" autocomplete="email">
  <label class="k"><input type="checkbox" id="kvkk"> Fotoğrafımın yalnızca bana gönderilmek üzere işlenmesini kabul ediyorum. Fotoğraf ve e-posta adresim kaydedilmez.</label>
  <button id="btnSend" style="width:100%">Gönder</button>
</div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js"></script>
<script>
// ====== AYAR: Google Apps Script web uygulaması URL'sini buraya yapıştır ======
const MAIL_ENDPOINT = "https://script.google.com/macros/s/AKfycbyRwX3FRoyzMgjoUsum5JkuCIuCOVQU4UVQbHJwKLvzTQQHopS7mU4SbT6ZsZ1i0dy5nQ/exec";
// ===========================================================================
const W=1080,H=1920;
const $=id=>document.getElementById(id);
const THEMES=[{n:"🛩️ Yerli Savunma Sanayii"},{n:"🌿 Teknoloji Bağımlısı Olma"}];
let theme=0,cutout=null;
const imgs={};
["logo-festival.png","logo-ttt.png"].forEach(f=>{const i=new Image();i.src=f;imgs[f]=i});

// kamera (varsayılan: arka kamera)
let facing="environment",stream=null;
async function startCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    $("video").srcObject=stream;
    $("video").classList.toggle("mirror",facing==="user");
    $("msg").textContent="";
  }catch(e){$("msg").textContent="Kamera açılamadı. Tarayıcı izni verin ve sayfayı https üzerinden açın."}
}
startCam();

// arkaplan silme (tarayıcıda çalışır; ücretsiz, sınırsız, görsel sunucuya gitmez)
const seg=new SelfieSegmentation({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/${f}`});
seg.setOptions({modelSelection:0});
let resolveSeg;
seg.onResults(r=>resolveSeg(r));
function segment(canvas){return new Promise(async res=>{resolveSeg=res;await seg.send({image:canvas})})}

function capture(){
  const v=$("video"),vw=v.videoWidth,vh=v.videoHeight,R=W/H;
  let ch=vh,cw=vh*R; if(cw>vw){cw=vw;ch=vw/R}
  const c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d");
  if(facing==="user"){x.translate(W,0);x.scale(-1,1)}
  x.drawImage(v,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,W,H);
  return c;
}

async function shoot(){
  $("btnShoot").disabled=true;$("msg").textContent="";
  const cnt=$("count");cnt.style.display="flex";
  for(let i=3;i>0;i--){cnt.textContent=i;await new Promise(r=>setTimeout(r,1000))}
  cnt.style.display="none";
  const frame=capture();
  $("busy").style.display="flex";
  try{
    const r=await segment(frame);
    const c=document.createElement("canvas");c.width=W;c.height=H;
    const x=c.getContext("2d");
    x.filter="blur(2.5px)";x.drawImage(r.segmentationMask,0,0,W,H);x.filter="none";
    x.globalCompositeOperation="source-in";x.drawImage(frame,0,0,W,H);
    cutout=c;
  }catch(e){$("busy").style.display="none";$("btnShoot").disabled=false;$("msg").textContent="Arkaplan silinemedi, tekrar deneyin.";return}
  $("busy").style.display="none";
  $("video").classList.add("hide");$("result").classList.remove("hide");
  $("rowShoot").classList.add("hide");$("rowResult").classList.remove("hide");
  $("btnShoot").disabled=false;
  render();
}

function rr(x,a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
const NAVY="#17365d",RED="#c8202a";
const SH={
 kaan:[[0,-110],[10,-80],[16,-40],[92,42],[98,64],[32,56],[22,84],[36,100],[8,94],[0,100]],
 kizil:[[0,-100],[8,-72],[10,-52],[36,-50],[38,-40],[11,-32],[96,32],[93,50],[14,42],[12,72],[26,90],[8,86],[0,94]],
 akinci:[[0,-90],[6,-62],[8,-22],[150,-14],[150,2],[8,14],[7,56],[44,78],[44,88],[6,80],[0,90]]
};
function plane(x,k,cx,cy,sc,rot){
  const p=SH[k],r=rot*Math.PI/180;
  // iz (kuyruk çizgisi)
  const dx=Math.sin(r),dy=-Math.cos(r);
  x.save();x.strokeStyle="#17365d33";x.lineWidth=5;x.setLineDash([16,16]);
  x.beginPath();x.moveTo(cx-dx*sc*105,cy-dy*sc*105);x.lineTo(cx-dx*(sc*105+300),cy-dy*(sc*105+300));x.stroke();x.restore();
  x.save();x.translate(cx,cy);x.rotate(r);x.scale(sc,sc);
  x.shadowColor="#17365d44";x.shadowBlur=18;x.shadowOffsetY=10;
  x.fillStyle=NAVY;x.beginPath();
  p.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));
  for(let i=p.length-2;i>0;i--)x.lineTo(-p[i][0],p[i][1]);
  x.closePath();x.fill();x.shadowColor="transparent";
  x.strokeStyle="#ffffff55";x.lineWidth=3;x.beginPath();x.moveTo(0,p[0][1]+10);x.lineTo(0,p[p.length-1][1]-6);x.stroke();
  x.fillStyle=RED;x.beginPath();x.arc(0,p[0][1]+34,5,0,7);x.fill();
  x.restore();
}
function heli(x,cx,cy,sc,rot){
  x.save();x.translate(cx,cy);x.rotate(rot*Math.PI/180);x.scale(sc,sc);
  x.shadowColor="#17365d44";x.shadowBlur=18;x.shadowOffsetY=10;
  x.fillStyle=NAVY;
  x.beginPath();x.ellipse(0,0,26,58,0,0,7);x.fill();
  x.fillRect(-5,40,10,112);x.fillRect(-26,142,52,9);
  x.shadowColor="transparent";
  x.strokeStyle="#17365d22";x.lineWidth=3;x.beginPath();x.arc(0,-6,150,0,7);x.stroke();
  x.strokeStyle=NAVY;x.lineWidth=9;x.lineCap="round";
  for(let k=0;k<4;k++){const a=Math.PI/4+k*Math.PI/2;x.beginPath();x.moveTo(0,-6);x.lineTo(Math.cos(a)*148,-6+Math.sin(a)*148);x.stroke()}
  x.fillStyle=RED;x.beginPath();x.arc(0,-6,9,0,7);x.fill();
  x.restore();
}
function label(x,t,sub,px,py){
  x.textAlign="center";x.fillStyle=NAVY;
  x.font="800 30px system-ui,Arial,sans-serif";if("letterSpacing" in x)x.letterSpacing="4px";
  x.fillText(t,px,py);
  if("letterSpacing" in x)x.letterSpacing="0px";
  x.fillStyle="#17365dbb";x.font="600 22px system-ui,Arial,sans-serif";x.fillText(sub,px,py+32);
}
function band(x,off,wd,col){x.fillStyle=col;x.beginPath();x.moveTo(W-off,0);x.lineTo(W-off+wd,0);x.lineTo(W,off-wd);x.lineTo(W,off);x.closePath();x.fill()}

function bgDefense(x){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#ffffff");g.addColorStop(1,"#e3ecf5");
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle="#1f4e8c12";x.lineWidth=2;
  for(let i=0;i<=W;i+=60){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
  for(let i=0;i<=H;i+=60){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}
  x.strokeStyle="#1f4e8c22";x.lineWidth=3;
  [260,420,580,760].forEach(r=>{x.beginPath();x.arc(540,900,r,0,7);x.stroke()});
  band(x,300,36,RED);band(x,356,36,"#1ab6e8");band(x,412,36,"#f6a21e");
  x.textAlign="center";x.fillStyle=NAVY;x.font="800 46px system-ui,Arial,sans-serif";
  if("letterSpacing" in x)x.letterSpacing="10px";x.fillText("YERLİ VE MİLLİ",540,290);
  x.fillStyle=RED;x.font="700 28px system-ui,Arial,sans-serif";if("letterSpacing" in x)x.letterSpacing="6px";
  x.fillText("SAVUNMA SANAYİİMİZ",540,336);if("letterSpacing" in x)x.letterSpacing="0px";
  plane(x,"kaan",270,540,1.35,-28);label(x,"KAAN","Milli Muharip Uçak",270,720);
  plane(x,"kizil",810,520,1.35,28);label(x,"KIZILELMA","Muharip İnsansız Uçak",810,700);
  plane(x,"akinci",175,1010,0.95,-12);label(x,"AKINCI","Bayraktar Taarruzi İHA",175,1150);
  heli(x,915,1030,1.0,8);label(x,"GÖKBEY","Helikopter",915,1250);
}

function cloud(x,cx,cy,s){x.save();x.fillStyle="#fff";x.shadowColor="#6aa7c633";x.shadowBlur=20;x.shadowOffsetY=8;
  [[0,0,50],[55,-20,64],[120,0,52],[60,16,46]].forEach(([a,b,r])=>{x.beginPath();x.arc(cx+a*s,cy+b*s,r*s,0,7);x.fill()});x.restore()}
function tree(x,cx,cy,s,c){x.fillStyle="#8a5a3c";x.fillRect(cx-8*s,cy-10*s,16*s,60*s);x.fillStyle=c;
  [[0,-60,48],[-30,-30,38],[30,-30,38]].forEach(([a,b,r])=>{x.beginPath();x.arc(cx+a*s,cy+b*s,r*s,0,7);x.fill()})}
function bgDetox(x){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#ffffff");g.addColorStop(.55,"#eef9f2");g.addColorStop(1,"#d8f0e2");
  x.fillStyle=g;x.fillRect(0,0,W,H);
  const rg=x.createRadialGradient(900,640,20,900,640,330);rg.addColorStop(0,"#ffe08aee");rg.addColorStop(1,"#ffe08a00");
  x.fillStyle=rg;x.fillRect(0,0,W,H);
  x.fillStyle="#ffc83d";x.beginPath();x.arc(900,640,68,0,7);x.fill();
  cloud(x,90,430,.8);cloud(x,700,760,.7);cloud(x,60,1250,.6);
  // kuşlar
  x.strokeStyle="#17365d88";x.lineWidth=5;x.lineCap="round";
  [[760,560,1],[830,500,.8],[700,500,.7]].forEach(([a,b,s])=>{x.beginPath();x.moveTo(a-26*s,b);x.quadraticCurveTo(a-13*s,b-18*s,a,b);x.quadraticCurveTo(a+13*s,b-18*s,a+26*s,b);x.stroke()});
  // tepeler
  const hill=(y,c,a)=>{x.fillStyle=c;x.beginPath();x.moveTo(0,y);x.bezierCurveTo(260,y-a,520,y+a*.6,W/2,y-a*.3);x.bezierCurveTo(780,y-a*1.1,900,y+a*.5,W,y-a*.4);x.lineTo(W,H);x.lineTo(0,H);x.closePath();x.fill()};
  hill(1320,"#c5ead2",90);hill(1420,"#9fdcb6",80);hill(1520,"#6ec896",70);
  tree(x,120,1380,1.1,"#3fae6f");tree(x,970,1340,1.0,"#2f9a5f");tree(x,230,1470,.8,"#4fbf7e");tree(x,860,1450,.9,"#3fae6f");
  // başlık
  x.textAlign="center";x.fillStyle="#12304f";x.font="800 62px system-ui,Arial,sans-serif";
  x.fillText("Ekrandan başını kaldır,",540,290);
  x.fillStyle="#1f9d55";x.font="800 76px system-ui,Arial,sans-serif";x.fillText("hayata bak!",540,372);
  x.fillStyle="#12304f99";x.font="600 28px system-ui,Arial,sans-serif";x.fillText("Teknolojiyi tüketme, onunla üret.",540,426);
  // üstü çizili telefon
  x.save();x.translate(175,720);x.scale(.78,.78);
  x.strokeStyle="#12304f";x.lineWidth=10;x.beginPath();x.roundRect(-55,-100,110,200,20);x.stroke();
  x.fillStyle="#12304f22";x.beginPath();x.roundRect(-44,-80,88,150,10);x.fill();
  x.fillStyle="#12304f";x.beginPath();x.arc(0,86,6,0,7);x.fill();
  x.strokeStyle=RED;x.lineWidth=16;x.beginPath();x.arc(0,0,128,0,7);x.stroke();
  x.beginPath();x.moveTo(-90,-90);x.lineTo(90,90);x.stroke();x.restore();
  // etiketler
  const badge=(cx,cy,c,t,rot)=>{x.save();x.translate(cx,cy);x.rotate(rot*Math.PI/180);x.fillStyle=c;x.shadowColor="#0003";x.shadowBlur=16;x.shadowOffsetY=6;
    x.beginPath();x.arc(0,0,86,0,7);x.fill();x.shadowColor="transparent";x.strokeStyle="#fff";x.lineWidth=4;x.setLineDash([8,8]);x.beginPath();x.arc(0,0,74,0,7);x.stroke();
    x.setLineDash([]);x.fillStyle="#fff";x.font="800 30px system-ui,Arial,sans-serif";x.fillText(t,0,11);x.restore()};
  badge(130,1060,"#ff7a45","ÜRET!",-8);badge(955,1000,"#1ab6e8","KEŞFET!",8);badge(940,1230,"#1f9d55","PAYLAŞ!",-6);
}

function frame(x){
  const fg=x.createLinearGradient(0,H-520,0,H);fg.addColorStop(0,"#ffffff00");fg.addColorStop(.55,"#fffffff0");fg.addColorStop(1,"#ffffff");
  x.fillStyle=fg;x.fillRect(0,H-520,W,520);
  // üst küçük festival logosu
  x.save();x.shadowColor="#0002";x.shadowBlur=18;x.shadowOffsetY=6;x.fillStyle="#fff";rr(x,410,56,260,120,28);x.restore();
  const f=imgs["logo-festival.png"],fw=212,fh=fw*f.naturalHeight/f.naturalWidth;
  x.drawImage(f,540-fw/2,56+(120-fh)/2,fw,fh);
  // slogan
  x.textAlign="center";
  x.fillStyle=RED;rr(x,480,1600,120,6,3);
  x.fillStyle="#12304f";x.font="800 48px system-ui,Arial,sans-serif";x.fillText("Güçlü Aileler, Bağımsız Yarınlar",540,1672);
  x.fillStyle="#12304fcc";x.font="600 27px system-ui,Arial,sans-serif";x.fillText("2. Yeşilay Bağımsız Aile Festivali",540,1718);
  // alt sol T3 logosu, alt sağ hashtag
  x.save();x.shadowColor="#0002";x.shadowBlur=14;x.shadowOffsetY=5;x.fillStyle="#fff";rr(x,60,1782,210,84,22);x.restore();
  const l=imgs["logo-ttt.png"],lw=160,lh=lw*l.naturalHeight/l.naturalWidth;
  x.drawImage(l,60+(210-lw)/2,1782+(84-lh)/2,lw,lh);
  x.textAlign="right";x.fillStyle=RED;x.font="800 40px system-ui,Arial,sans-serif";
  x.fillText("#t3vakfıadana",W-60,1838);
}

function render(){
  const cv=$("result");cv.width=W;cv.height=H;
  const x=cv.getContext("2d");
  (theme==0?bgDefense:bgDetox)(x);
  const s=0.9,pw=W*s,ph=H*s;
  x.save();x.shadowColor="#00000040";x.shadowBlur=28;x.shadowOffsetY=8;
  x.drawImage(cutout,(W-pw)/2,360,pw,ph);x.restore();
  frame(x);
}

// tema seçici
THEMES.forEach((t,i)=>{
  const b=document.createElement("button");b.className="alt chip"+(i?"":" on");b.textContent=t.n;
  b.onclick=()=>{theme=i;document.querySelectorAll(".chip").forEach((e,j)=>e.classList.toggle("on",j==i));render()};
  $("themes").appendChild(b);
});

function retake(){
  $("video").classList.remove("hide");$("result").classList.add("hide");
  $("rowShoot").classList.remove("hide");$("rowResult").classList.add("hide");
  $("mailbox").style.display="none";$("msg").textContent="";cutout=null;
}
function download(){
  const a=document.createElement("a");a.download="hatira-t3adana.jpg";a.href=$("result").toDataURL("image/jpeg",0.95);a.click();
}
async function send(){
  const em=$("email").value.trim();
  if(!/^\S+@\S+\.\S+$/.test(em)){$("msg").textContent="Geçerli bir e-posta adresi yazın.";return}
  if(!$("kvkk").checked){$("msg").textContent="Lütfen onay kutusunu işaretleyin.";return}
  if(!MAIL_ENDPOINT){$("msg").textContent="Mail ayarı yapılmamış (MAIL_ENDPOINT boş).";return}
  $("btnSend").disabled=true;$("msg").textContent="Gönderiliyor…";
  try{
    await fetch(MAIL_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({email:em,image:$("result").toDataURL("image/jpeg",0.93).split(",")[1]})});
    $("msg").textContent="✅ Gönderildi! Gelen kutunu (gerekirse spam klasörünü) kontrol et.";
    $("email").value="";$("kvkk").checked=false;
    setTimeout(retake,6000);
  }catch(e){$("msg").textContent="Gönderilemedi, internet bağlantısını kontrol edip tekrar deneyin."}
  $("btnSend").disabled=false;
}
$("btnShoot").onclick=shoot;$("btnFlip").onclick=()=>{facing=facing==="user"?"environment":"user";startCam()};$("btnRetake").onclick=retake;$("btnDownload").onclick=download;
$("btnMail").onclick=()=>{$("mailbox").style.display="block";$("email").focus()};
$("btnSend").onclick=send;
</script>
</body>
</html>
